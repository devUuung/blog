<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Research note</title>
    <style>
      html, body {
        width: 100%;
        height: 100%;
        margin: 0;
        background: #202020;
      }

      object {
        display: block;
        width: 100%;
        height: 100%;
        border: 0;
      }

      .missing-pdf {
        display: grid;
        min-height: 100%;
        place-items: center;
        margin: 0;
        padding: 24px;
        color: #d5d5d5;
        font: 14px/1.6 ui-monospace, SFMono-Regular, Menlo, monospace;
        text-align: center;
      }
    </style>
  </head>
  <body>
    <!-- PDF 파일 경로만 직접 바꾸면 됩니다. -->
    <object data="pdf/your-file.pdf" type="application/pdf">
      <p class="missing-pdf">PDF 파일을 <code>pdf/your-file.pdf</code> 경로에 넣어주세요.</p>
    </object>
  </body>
</html>
