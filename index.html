<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Ungsik Kim's personal home page">
  <title>Ungsik Kim's Home Page</title>
  <style>
    body { max-width: 1000px; }
    .layout { display: grid; grid-template-columns: 180px minmax(0, 1fr); gap: 48px; }
    .sidebar { position: sticky; top: 20px; align-self: start; }
    .sidebar h1 { margin-top: 0; }
    .sidebar nav p { margin: 8px 0; }
    .content { min-width: 0; border-left: 1px solid; padding-left: 48px; }
    @media (max-width: 700px) {
      .layout { display: block; }
      .sidebar { position: static; border-bottom: 1px solid; padding-bottom: 16px; }
      .sidebar nav p { display: inline; margin-right: 16px; }
      .content { border-left: 0; padding-left: 0; }
    }
  </style>
</head>

<body>
  <main class="layout">
    <aside class="sidebar">
      <h1>Ungsik Kim</h1>
      <p>Research notes and small experiments.</p>
      <nav aria-label="Site navigation">
        <p><a href="research-notes.html">Research Notes</a></p>
        <p><a href="about.html">About</a></p>
      </nav>
      <p><a href="https://github.com/devUuung">Github</a></p>
    </aside>

    <div class="content">
      <h2>Welcome</h2>
      <p>Welcome to my small personal website.</p>
      <p>
        I write about explainable AI, recommender systems, numerical linear
        algebra, tensor networks, and computer science theory.
      </p>
      <p><a href="research-notes.html">Read my research notes →</a></p>
    </div>
  </main>
</body>
</html>
