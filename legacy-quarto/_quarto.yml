project:
  type: website
  output-dir: _site

website:
  title: "Research Notes"
  description: "Theory notes, paper reviews, and research logs."
  site-url: "https://example.com"
  navbar:
    right:
      - text: "Posts"
        href: index.qmd
      - text: "About"
        href: about.qmd
      - icon: github
        href: https://github.com/
  page-footer:
    left: "Copyright 2026"
    right:
      - icon: rss
        href: index.xml
  open-graph: true
  twitter-card: true

format:
  html:
    theme:
      light: cosmo
      dark: darkly
    css: styles.css
    toc: true
    toc-depth: 3
    code-copy: true
    code-overflow: wrap
    number-sections: false
    html-math-method: katex

bibliography: references.bib
csl: https://www.zotero.org/styles/association-for-computing-machinery

execute:
  freeze: auto

lang: ko
